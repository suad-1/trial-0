<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
     <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
    <script src="https://code.iconify.design/iconify-icon/2.1.0/iconify-icon.min.js"></script>
</head>
<body>
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-4">
                <div class="card mt-5 p-4 shadow">
                    <h1 class="text-center mb-4">My HomePage</h1> 
                    <form>
                       <div class="mb-3">
                          <label class="form-label">Email</label>
                          <input type="email" class="form-control" placeholder="Enter your email">
                       </div>
                       <div class="mb-3">
                          <label class="form-label">Password</label>
                          <input type="password" class="form-control" placeholder="Enter your password">
                       </div> 
                       <div class="mb-3 row">
                         <div class="col">
                          <input type="checkbox" class="form-check-input">
                          <label class="form-label">Remember me</label>
                         </div>
                         <div class="col nav text-end">
                          <a href="#" class="nav-link">Forgot password?</label> 
                         </div>
                       </div>
                    </form>
                <div class="container-fluid">
                    <a href="dashboard.html" class="nav-brand rounded-full btn btn-danger d-flex justify-content-center">Login</a>
                </div>    
                </div>
            </div>
        </div>
    </div> 
</body>
</html>
